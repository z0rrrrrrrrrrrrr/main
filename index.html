<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff; /* White background to match the image */
            position: relative;
        }

        #bouncing-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px; /* Adjust this number to make the image bigger or smaller */
            height: auto;
            will-change: transform;
            transform-origin: center center; 
        }
    </style>
</head>
<body>
    <!-- Make sure your image is named exactly like this, or change the name here to match your file -->
    <img id="bouncing-image" src="022_11.jpg" alt="Bouncing Character">

    <script>
        const img = document.getElementById('bouncing-image');
        
        let x = 0;
        let y = 0;
        let vx = 2; // Horizontal speed (slower)
        let vy = 2; // Vertical speed (slower)
        let scaleX = 1; // 1 for facing right, -1 for facing left
        
        // Wait for the image to load before starting the animation
        img.onload = function() {
            animate();
        };
        
        // If the image is already cached/loaded
        if (img.complete) {
            animate();
        }
        
        function animate() {
            const maxX = window.innerWidth - img.offsetWidth;
            const maxY = window.innerHeight - img.offsetHeight;
            
            x += vx;
            y += vy;
            
            // Hit right wall -> flip to face left
            if (x >= maxX) {
                vx = -vx;
                scaleX = -1;
                x = maxX; 
            }
            
            // Hit left wall -> flip to face right
            if (x <= 0) {
                vx = -vx;
                scaleX = 1;
                x = 0; 
            }
            
            // Hit bottom or top -> just bounce, keep current horizontal flip
            if (y >= maxY || y <= 0) {
                vy = -vy;
                y = Math.max(0, Math.min(y, maxY));
            }
            
            // Apply position and horizontal flip
            img.style.transform = `translate(${x}px, ${y}px) scaleX(${scaleX})`;
            
            requestAnimationFrame(animate);
        }
        
        // Handle window resize so it doesn't get stuck off-screen
        window.addEventListener('resize', function() {
            const maxX = window.innerWidth - img.offsetWidth;
            const maxY = window.innerHeight - img.offsetHeight;
            x = Math.min(x, maxX);
            y = Math.min(y, maxY);
        });
    </script>
</body>
</html>
