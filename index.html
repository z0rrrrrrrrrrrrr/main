<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>wife wife wife</title>
<style>
  * { box-sizing: border-box; }

  html {
    height: 100%;
    height: 100dvh;                /* dynamic viewport height (mobile) */
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;     /* no pull-to-refresh / bounce */
  }

  body {
    height: 100%;
    height: 100dvh;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background-color: #0a0c11;
    /* fallback gradient — replaced by images/bg.* when found */
    background-image: radial-gradient(circle at 50% 25%, #1c2230, #0a0c11 70%);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    /* background-attachment: fixed removed — unreliable on iOS */
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #stage {
    display: inline-block;
    line-height: 0;
    touch-action: manipulation;    /* no double-tap zoom, no tap delay */
  }

  #media {
    display: block;
    opacity: 0;
    transition: opacity 0.5s ease;
    -webkit-user-drag: none;
    user-drag: none;
    outline: none;
    background: transparent;
    /* prevents long-press “Save image” sheet on iOS */
    -webkit-touch-callout: none;
  }

  #media.ready    { opacity: 1; }
  #media.playable { cursor: pointer; }
</style>
</head>
<body>

<div id="stage"></div>

<script>
(() => {
  "use strict";

  const CONFIG = {
    folder: "images/",
    extensions: ["gif", "mp4", "webm", "webp", "png", "jpg", "jpeg", "avif", "jxl"],
    bgExtensions: ["jpg", "jpeg", "png", "webp", "gif", "avif", "jxl"],
    mediaName: "love",              // Changed from "gif" to "love"
    fitRatio: 0.86,
    allowUpscale: false,
    videoMuted: true,
    bgNames: ["bg"],
    bgScrim: 0                      // Changed to 0 for transparent overlay
  };

  const VIDEO_RE = /\.(mp4|webm|mov|m4v|ogv|ogg|mkv)$/i;
  const stage = document.getElementById("stage");
  const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

  let media = null;
  let isVideo = false;
  let mediaW = 1, mediaH = 1;

  /* Visible viewport — visualViewport when available (mobile) */
  function vpW() { return (window.visualViewport && visualViewport.width)  || window.innerWidth; }
  function vpH() { return (window.visualViewport && visualViewport.height) || window.innerHeight; }

  /* ---------------- file discovery ---------------- */
  const imageUrl = (name, ext) => `${CONFIG.folder}${name}.${ext}`;

  function exists(url) {
    return fetch(url, { method: "HEAD" })
      .then(res => res.ok)
      .catch(() => existsViaImage(url));
  }

  function existsViaImage(url) {
    return new Promise(resolve => {
      const probe = new Image();
      probe.onload  = () => resolve(true);
      probe.onerror = () => resolve(false);
      probe.src = url;
    });
  }

  async function findFile(name, extensions) {
    const checks = await Promise.all(
      extensions.map(async ext => {
        const url = imageUrl(name, ext);
        return { url, ok: await exists(url) };
      })
    );
    const hit = checks.find(c => c.ok);
    return hit ? hit.url : null;
  }

  /* ---------------- background ---------------- */
  async function applyBackground() {
    for (const name of CONFIG.bgNames) {
      const url = await findFile(name, CONFIG.bgExtensions);
      if (!url) continue;

      await new Promise(resolve => {
        const pre = new Image();
        pre.onload = pre.onerror = resolve;
        pre.src = url;
      });

      const scrim = clamp(CONFIG.bgScrim, 0, 1);
      const layers = [];

      // Since scrim is 0, this block is skipped entirely
      if (scrim > 0) {
        layers.push(`linear-gradient(rgba(0,0,0,${scrim}), rgba(0,0,0,${scrim}))`);
      }
      layers.push(`url("${url}")`);
      layers.push(`radial-gradient(circle at 50% 25%, #1c2230, #0a0c11 70%)`);

      document.body.style.backgroundImage = layers.join(", ");
      // Adjusting background-size to match the number of layers
      document.body.style.backgroundSize = scrim > 0 ? "cover, cover, cover" : "cover, cover";
      document.body.style.backgroundPosition = "center, center, center";
      document.body.style.backgroundRepeat = "no-repeat, no-repeat, no-repeat";
      return url;
    }
    return null;
  }

  /* ---------------- sizing ---------------- */
  function fitMedia() {
    if (!media) return;
    const maxW = vpW() * CONFIG.fitRatio;
    const maxH = vpH() * CONFIG.fitRatio;
    let scale = Math.min(maxW / mediaW, maxH / mediaH);
    if (!CONFIG.allowUpscale) scale = Math.min(scale, 1);
    media.style.width  = Math.round(mediaW * scale) + "px";
    media.style.height = Math.round(mediaH * scale) + "px";
  }

  window.addEventListener("resize", fitMedia);
  window.addEventListener("orientationchange", () => setTimeout(fitMedia, 100));

  if (window.visualViewport) {
    visualViewport.addEventListener("resize", fitMedia);
    visualViewport.addEventListener("scroll", fitMedia);
  }

  /* ---------------- element factories ---------------- */
  function createImage(url) {
    const img = document.createElement("img");
    img.id = "media";
    img.alt = "";
    img.draggable = false;
    img.addEventListener("error", () => console.warn("[media] image failed:", url));
    img.addEventListener("load", () => {
      mediaW = img.naturalWidth  || 1;
      mediaH = img.naturalHeight || 1;
      fitMedia();
      img.classList.add("ready");
    }, { once: true });
    img.src = url;
    stage.appendChild(img);
    media = img;
  }

  function createVideo(url) {
    const v = document.createElement("video");
    v.id = "media";
    v.src = url;
    v.loop = true;
    v.muted = CONFIG.videoMuted;
    v.playsInline = true;
    v.preload = "auto";
    v.controls = false;
    v.draggable = false;
    v.classList.add("playable");
    v.setAttribute("playsinline", "");
    v.setAttribute("webkit-playsinline", "");
    v.setAttribute("x5-playsinline", "");
    v.setAttribute("disablepictureinpicture", "");

    v.addEventListener("error", () => console.warn("[media] video failed:", url));

    v.addEventListener("loadedmetadata", () => {
      mediaW = v.videoWidth  || 1;
      mediaH = v.videoHeight || 1;
      fitMedia();
      v.classList.add("ready");

      /* iOS Safari won't paint a paused video's first frame until it
         has been decoded. Seeking to a hair past 0 forces it. */
      if (v.currentTime === 0) {
        try { v.currentTime = 0.001; } catch (_) {}
      }
    }, { once: true });

    stage.appendChild(v);
    media = v;
    isVideo = true;
  }

  /* ---------------- click to play / pause ---------------- */
  stage.addEventListener("click", () => {
    if (!isVideo || !media) return;
    if (media.paused) {
      const p = media.play();
      if (p && typeof p.then === "function") {
        p.catch(err => console.warn("[media] play failed:", err));
      }
    } else {
      media.pause();
    }
  });

  /* ---------------- go ---------------- */
  (async () => {
    const [, url] = await Promise.all([
      applyBackground(),
      findFile(CONFIG.mediaName, CONFIG.extensions)
    ]);

    if (!url) {
      console.warn("[media] no", CONFIG.mediaName + ".*", "found in", CONFIG.folder);
      return;
    }

    if (VIDEO_RE.test(url)) createVideo(url);
    else                     createImage(url);
  })();
})();
</script>
</body>
</html>
